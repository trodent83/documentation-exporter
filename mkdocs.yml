site_name: Documentation.Exporter
site_description: Extensible .NET 11 CLI & library exporting C# assemblies and XML docs into Microsoft Learn-style MkDocs Markdown, Mermaid/PlantUML diagrams, site navigation, and CI quality reports.
site_url: https://trodent83.github.io/documentation-exporter/
repo_name: trodent83/documentation-exporter
repo_url: https://github.com/trodent83/documentation-exporter
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - User Guide:
      - Overview: user/index.md
      - Getting Started & Demo Showcase: user/getting-started-and-demo.md
      - CLI Commands, Options, & JSON Configuration: user/cli-and-configuration.md
      - Authoring XML Documentation Comments: user/xml-documentation-authoring.md
      - External Examples, Sidecars, & External Links: user/examples-overrides-and-external-links.md
      - Diagrams, Assembly References, & Dependency Tree: user/diagrams-and-assembly-insights.md
      - MkDocs Navigation, Quality Gates, & CI: user/mkdocs-and-ci-integration.md
      - AI Agent Command for XML Documentation: user/ai-agent-documentation-command.md
      - Recommended AI Agent Rules for C# Projects: user/ai-agent-recommended-csharp-rules.md
  - Developer Guide:
      - Overview: developer/index.md
      - Onboarding & New Developer Guide: developer/onboarding.md
      - Coding Standards, Mandates, & DI Setup: developer/coding-standards-and-di.md
      - Extensibility Guide: developer/extensibility-guide.md
      - Testing & 90% Coverage Gates: developer/testing-and-coverage.md
      - Scripts, CI/CD, Releases, & Docker: developer/scripts-and-automation.md
      - Structured Logging & Localization: developer/logging-and-localization.md
      - Functionality Deep-Dives:
          - CLI Hosting & JSON Configuration: developer/functionalities/cli-and-configuration.md
          - Solution & Build Artifact Discovery: developer/functionalities/solution-and-artifact-discovery.md
          - Isolated Loading & Reflection: developer/functionalities/assembly-loading-and-reflection.md
          - Assembly References & Dependency Tree: developer/functionalities/assembly-references-and-dependency-tree.md
          - XML Parsing & Link Resolution: developer/functionalities/xml-parsing-and-link-resolution.md
          - Enrichment, Snippets, & Overrides: developer/functionalities/enrichment-snippets-and-overrides.md
          - Markdown & Single-Diagram Selection: developer/functionalities/markdown-and-diagram-generation.md
          - Navigation, Quality Gates, & Localization: developer/functionalities/navigation-quality-gates-and-localization.md
          - Plugin System & Abstractions SPI: developer/functionalities/plugin-system.md
  - Architecture:
      - Architecture Overview: architectural/index.md
      - Functionality Catalog: architectural/functionality-catalog.md
      - .NET & C# Language Support Matrix: architectural/dotnet-language-support-matrix.md
      - Component Interactions & Data Flow: architectural/component-interactions.md
      - Domain Models, Strong Enums, & DI Lifetimes: architectural/domain-models-and-lifetimes.md
  - API Reference:
